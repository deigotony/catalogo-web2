<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reliktas - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="main.html">Relikta</a>
        <a href="login.html">Login</a>
        <a href="../privado/cadastro.html">Cadastrar itens</a>
    </nav>

    <div class="container">
        <h2>Login</h2>

        <form onsubmit="logarUsuario(event)">
            <input type="email" id="usuario" placeholder="Seu e-mail" required>
            <input type="password" id="senha" placeholder="Sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p class="link">
            Ainda não possui uma conta?
            <a href="criar_conta.html">Cadastre-se</a>
        </p>
    </div>

    <script src="script-logins.js"></script>
</body>
</html>
